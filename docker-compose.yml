version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gotravel-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"
      MSSQL_PID: "Express"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - gotravel-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD:-YourStrong@Password123}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./GoTravel.API
      dockerfile: Dockerfile
    container_name: gotravel-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GoTravelDB;User Id=sa;Password=${DB_PASSWORD:-YourStrong@Password123};TrustServerCertificate=True;
      - JwtSettings__Secret=${JWT_SECRET:-SecretKeyGoTravelJwtToken1234567890}
      - AI_API_KEY=${AI_API_KEY:-}
    ports:
      - "5106:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - gotravel-network
    restart: unless-stopped

  frontend:
    build:
      context: ./travel-ticket-frontend
      dockerfile: Dockerfile
    container_name: gotravel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gotravel-network
    restart: unless-stopped

networks:
  gotravel-network:
    driver: bridge

volumes:
  sqlserver-data:
