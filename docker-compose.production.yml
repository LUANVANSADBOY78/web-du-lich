version: '3.8'

services:
  sqlserver:
    restart: unless-stopped
    volumes:
      - sqlserver-data:/var/opt/mssql

  backend:
    image: gotravel-backend:${BUILD_NUMBER:-latest}
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GoTravelDB;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__Secret=${JWT_SECRET}
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    image: gotravel-frontend:${BUILD_NUMBER:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlserver-data:
